[project]
name = "grounded-travel-planner"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "langsmith>=0.4.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.38.0",
    "tavily-python>=0.7.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=24.0",
    "flake8>=7.0",
    "isort>=5.0",
    "pytest>=8.0",
    "ruff>=0.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/grounded_travel_planner", "src/utils"]

[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = '/\.codex/skills/ui-ux-pro-max/'

[tool.isort]
profile = "black"
line_length = 88
extend_skip = [".codex/skills/ui-ux-pro-max"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [".codex/skills/ui-ux-pro-max"]

[tool.ruff.lint.per-file-ignores]
".codex/hooks/format_python.py" = ["UP045"]
