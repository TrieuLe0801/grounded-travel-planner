[project]
name = "grounded-travel-planner"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "black>=24.0",
    "flake8>=7.0",
    "isort>=5.0",
    "pytest>=8.0",
    "ruff>=0.12.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
".codex/hooks/format_python.py" = ["UP045"]
