name: CI and Mac deployment

on:
  push:
    branches:
      - feature/travel-ground-planner
  pull_request:
    branches:
      - feature/travel-ground-planner

permissions:
  contents: read

concurrency:
  group: grounded-travel-planner-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GTP_COORDINATOR_MODEL: ci-coordinator
      GTP_PLANNER_MODEL: ci-planner
      GTP_CHAT_MODEL: ci-chat
      GTP_OLLAMA_FALLBACK_MODEL: ci-fallback
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Run Python tests
        run: uv run pytest

      - name: Check Python formatting and lint
        run: |
          uv run isort --check-only . .codex/hooks/format_python.py
          uv run black --check . .codex/hooks/format_python.py
          uv run flake8 src tests .codex/hooks/format_python.py
          uv run ruff check . .codex/hooks/format_python.py

      - name: Check and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run build

      - name: Validate Compose configuration
        run: |
          set -eu
          trap 'rm -f .env' EXIT
          cat > .env <<'EOF'
          GTP_COORDINATOR_MODEL=ci-coordinator
          GTP_PLANNER_MODEL=ci-planner
          GTP_CHAT_MODEL=ci-chat
          GTP_OPENAI_JSON_SCHEMA_MODELS=ci-model
          GTP_OLLAMA_FALLBACK_MODEL=ci-fallback
          GTP_SAVED_TOURS_POSTGRES_PASSWORD=ci-only-placeholder
          EOF
          docker compose config --quiet
