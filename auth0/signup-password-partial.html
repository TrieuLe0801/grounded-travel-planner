<script>
  function validateConfirmPassword(element, formSubmitted) {
    const password = document.querySelector('input[name="password"]') ||
      document.querySelector('input[autocomplete="new-password"]:not(#confirmPassword)');
    if (!password) return false;
    if (!formSubmitted && !element.value) return true;
    return element.value !== '' && element.value === password.value;
  }
</script>
<div class="ulp-field">
  <label for="confirmPassword">Xác nhận mật khẩu / Confirm password</label>
  <input
    type="password"
    id="confirmPassword"
    autocomplete="new-password"
    aria-describedby="confirmPasswordError"
    required
  />
  <div
    id="confirmPasswordError"
    class="ulp-error-info"
    role="alert"
    data-ulp-validation-function="validateConfirmPassword"
    data-ulp-validation-event-listeners="blur,change,input"
  >
    Mật khẩu không khớp / Passwords do not match.
  </div>
  <p>Ít nhất 8 ký tự, gồm chữ hoa, số và ký tự đặc biệt. / At least 8 characters, including an uppercase letter, a number and a special character.</p>
</div>
